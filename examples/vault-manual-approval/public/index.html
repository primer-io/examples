<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Primer manual approval example</title>
    <style>
      :root {
        --space-1: 8px;
        --space-2: 16px;
        --space-3: 24px;
        --space-4: 40px;
        --border: #d9d9de;
        --muted: #5c5c66;
      }
      body {
        font:
          18px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: #1a1a1f;
        max-width: 560px;
        margin: var(--space-4) auto;
        padding: 0 var(--space-2);
      }
      h1 {
        font-size: 28px;
        margin: 0 0 var(--space-1);
      }
      h2 {
        font-size: 20px;
        margin: var(--space-4) 0 var(--space-1);
      }
      p {
        margin: 0 0 var(--space-2);
      }
      .muted {
        color: var(--muted);
        font-size: 16px;
      }
      #order-total {
        font-weight: 600;
        margin-bottom: var(--space-3);
      }
      #route-picker {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: var(--space-2);
        margin: 0 0 var(--space-3);
      }
      #route-picker legend {
        font-weight: 600;
        padding: 0 var(--space-1);
      }
      #route-picker label {
        display: block;
        margin-top: var(--space-1);
      }
      .checkout-complete {
        font-weight: 600;
        margin: 24px 0 8px;
      }
      #log li {
        margin-bottom: var(--space-1);
      }
      #log li.error {
        color: #b00020;
      }
    </style>
  </head>
  <body>
    <h1>Pay with manual approval</h1>
    <p class="muted">
      The checkout pauses after the shopper pays. Your backend then decides
      which processor takes the payment.
    </p>

    <p id="order-total"></p>

    <!-- Only shown when the server allows overriding the route. -->
    <fieldset id="route-picker" hidden>
      <legend>Demo control: route</legend>
      <p class="muted">
        For demos only. In production, only your backend decides the route.
      </p>
      <label>
        <input type="radio" name="route" value="" checked />
        Backend default (<span id="default-route"></span>)
      </label>
      <label>
        <input type="radio" name="route" value="stripe" />
        Stripe (via Primer proxy)
      </label>
      <label>
        <input type="radio" name="route" value="primer" />
        Primer orchestration
      </label>
    </fieldset>

    <div id="checkout"></div>

    <h2>What happened</h2>
    <ol id="log"></ol>

    <script type="module" src="/app.js"></script>
  </body>
</html>
